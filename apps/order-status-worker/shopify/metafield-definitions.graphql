# Run one mutation at a time in Shopify Admin GraphiQL (or the custom app).
# Owner: ORDER. Namespace: custom.

mutation OrderStage {
  metafieldDefinitionCreate(definition: {
    name: "Order stage"
    namespace: "custom"
    key: "order_stage"
    description: "Production stage 1-8. Set by Flow from paid/tags/fulfilment. Do not trust the cart attribute."
    type: "single_line_text_field"
    ownerType: ORDER
    pin: true
  }) {
    createdDefinition { id name key }
    userErrors { field message }
  }
}

